<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1a2e">
<title>Budget Marti & Fra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--card:#1e1e35;--card2:#252545;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--fra:#e8a87c;--fra-dim:rgba(232,168,124,0.15);--marti:#a78bfa;--marti-dim:rgba(167,139,250,0.15);--common:#6ee7b7;--common-dim:rgba(110,231,183,0.12);--accent:#f472b6;--text:#f0f0f5;--text2:#9090b0;--text3:#5a5a7a;--success:#6ee7b7;--danger:#f87171;--warn:#fbbf24;--income:#34d399;--income-dim:rgba(52,211,153,0.12);--radius:16px;--radius-sm:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:17px;font-weight:600;letter-spacing:-.3px}
.logo span{color:var(--fra)}.logo span.m{color:var(--marti)}
.header-right{display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
.sync-dot.ok{background:var(--success)}.sync-dot.err{background:var(--danger)}.sync-dot.loading{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.month-nav{display:flex;align-items:center;gap:6px}
.month-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 6px;font-size:16px;border-radius:6px}
.month-btn:active{background:var(--card2)}
.month-label{font-weight:500;color:var(--text);min-width:110px;text-align:center;font-size:13px}
/* SEARCH + FILTER */
.search-filter-row{display:flex;gap:8px;align-items:center;margin-top:2px}
.search-wrap{flex:1;position:relative}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:50px;color:var(--text);padding:8px 34px 8px 14px;font-size:13px;font-family:'Sora',sans-serif;outline:none}
.search-input:focus{border-color:var(--accent)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;display:none}
.filter-btn{background:var(--card);border:1px solid var(--border);border-radius:50px;color:var(--text2);padding:7px 12px;font-size:12px;cursor:pointer;font-family:'Sora',sans-serif;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px;transition:all .15s}
.filter-btn.has-filter{border-color:var(--accent);color:var(--accent);background:rgba(244,114,182,.1)}
/* FILTER PANEL */
.filter-panel{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s}
.filter-panel.open{max-height:500px;padding:14px}
.filter-section-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;margin-top:12px}
.filter-section-title:first-child{margin-top:0}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:5px 12px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s}
.fchip.active{border-color:var(--accent);color:var(--accent);background:rgba(244,114,182,.1)}
.fchip.fra{border-color:var(--fra);color:var(--fra);background:var(--fra-dim)}
.fchip.marti{border-color:var(--marti);color:var(--marti);background:var(--marti-dim)}
.fchip.common{border-color:var(--common);color:var(--common);background:var(--common-dim)}
.filter-date-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.filter-date-input{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:12px;font-family:'Sora',sans-serif;outline:none;width:100%}
.filter-date-input:focus{border-color:var(--accent)}
.filter-actions{display:flex;gap:8px;margin-top:14px}
.filter-clear-btn{flex:1;padding:9px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:13px;font-family:'Sora',sans-serif;cursor:pointer}
.filter-apply-btn{flex:2;padding:9px;background:linear-gradient(135deg,var(--accent),#c084fc);border:none;border-radius:var(--radius-sm);color:white;font-size:13px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer}
/* BALANCE */
.balance-bar{background:var(--bg3);padding:14px 16px;border-bottom:1px solid var(--border)}
.balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.balance-card{background:var(--card);border-radius:var(--radius-sm);padding:11px 13px;border:1px solid var(--border)}
.balance-name{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.balance-amount{font-size:18px;font-weight:600;font-family:'Space Grotesk',sans-serif}
.balance-sub{font-size:10px;color:var(--text3);margin-top:2px}
.balance-card.fra .balance-amount{color:var(--fra)}.balance-card.marti .balance-amount{color:var(--marti)}
.saldo-pill{margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:50px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.saldo-pill>span{color:var(--text2)}
.saldo-value{font-weight:600;font-family:'Space Grotesk',sans-serif}
.saldo-value.pos{color:var(--success)}.saldo-value.neg{color:var(--danger)}.saldo-value.zero{color:var(--text2)}
/* NAV */
.nav-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{flex:1;min-width:52px;padding:10px 4px;background:none;border:none;color:var(--text3);font-size:10px;font-family:'Sora',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-tab .icon{font-size:16px}
.nav-tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.content{flex:1;overflow-y:auto;padding:14px 14px 80px}
.section-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
/* EXPENSE ITEMS */
.expense-item{background:var(--card);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:7px;border:1px solid var(--border);display:flex;align-items:center;gap:11px;cursor:pointer}
.expense-item.has-note{border-left:2px solid var(--accent)}
.expense-item.is-income{border-left:3px solid var(--income)}
.cat-badge{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.expense-info{flex:1;min-width:0}
.expense-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expense-meta{font-size:11px;color:var(--text2);margin-top:2px;display:flex;gap:6px;align-items:center}
.payer-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.expense-amount{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;text-align:right;flex-shrink:0}
.expense-split{font-size:10px;color:var(--text3);text-align:right;margin-top:2px}
.recur-badge{font-size:9px;background:var(--common-dim);color:var(--common);border:1px solid rgba(110,231,183,.3);border-radius:4px;padding:1px 5px;margin-left:3px}
.income-badge{font-size:9px;background:var(--income-dim);color:var(--income);border:1px solid rgba(52,211,153,.3);border-radius:4px;padding:1px 5px;margin-left:3px}
.budget-alert{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:12px;color:var(--warn);display:flex;align-items:center;gap:8px}
.budget-alert .bal{margin-left:auto;font-weight:600;font-family:'Space Grotesk',sans-serif}
.budget-over{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:var(--danger)}
/* FAB */
.fab{position:fixed;bottom:24px;right:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c084fc);border:none;color:white;font-size:24px;cursor:pointer;z-index:200;box-shadow:0 4px 20px rgba(244,114,182,.4);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:24px 24px 0 0;padding:22px 18px 40px;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;border-top:1px solid var(--border)}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:11px 13px;font-size:15px;font-family:'Sora',sans-serif;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input.amount-input{font-size:26px;font-family:'Space Grotesk',sans-serif;font-weight:600;text-align:center;padding:14px}
.form-input.amount-input.income{color:var(--income)}
.form-select option{background:var(--bg2)}
.form-textarea{resize:none;min-height:60px;font-size:13px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill-group{display:flex;gap:7px;flex-wrap:wrap}
.pill-opt{padding:7px 14px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:'Sora',sans-serif}
.pill-opt.fra-active{background:var(--fra-dim);border-color:var(--fra);color:var(--fra)}
.pill-opt.marti-active{background:var(--marti-dim);border-color:var(--marti);color:var(--marti)}
.pill-opt.common-active{background:var(--common-dim);border-color:var(--common);color:var(--common)}
.pill-opt.active{background:var(--accent);border-color:var(--accent);color:white}
.split-custom-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.split-slider{flex:1;accent-color:var(--accent)}
.split-labels{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),#c084fc);border:none;border-radius:var(--radius-sm);color:white;font-size:15px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;margin-top:8px;transition:opacity .15s}
.btn-primary:active{opacity:.85}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-income{background:linear-gradient(135deg,var(--income),#059669)}
.btn-secondary{width:100%;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:13px;font-family:'Sora',sans-serif;cursor:pointer;margin-top:8px}
.btn-danger{background:rgba(248,113,113,.15);border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:12px;margin-top:0;width:auto;display:inline-block}
.scan-area{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;margin-bottom:14px;background:var(--card)}
.scan-icon{font-size:32px;margin-bottom:6px}
.scan-text{font-size:13px;color:var(--text2)}
.scan-preview{width:100%;border-radius:var(--radius-sm);margin-bottom:10px;max-height:160px;object-fit:cover;display:none}
.scan-status{font-size:12px;text-align:center;padding:6px}
.scan-status.loading{color:var(--accent)}.scan-status.done{color:var(--success)}.scan-status.error{color:var(--danger)}
/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.stat-value{font-size:19px;font-weight:600;font-family:'Space Grotesk',sans-serif}
.stat-sub{font-size:11px;color:var(--text2);margin-top:2px}
.tab-sub{display:flex;gap:0;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px}
.tab-sub-btn{flex:1;padding:7px 3px;background:none;border:none;border-radius:8px;color:var(--text3);font-size:10px;font-family:'Sora',sans-serif;cursor:pointer;text-align:center;transition:all .15s}
.tab-sub-btn.active{background:var(--card2);color:var(--text);font-weight:500}
.persona-tabs{display:flex;gap:0;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px}
.persona-tab{flex:1;padding:9px 4px;background:none;border:none;border-radius:8px;color:var(--text3);font-size:12px;font-family:'Sora',sans-serif;cursor:pointer;text-align:center;transition:all .15s;font-weight:500}
.persona-tab.active-insieme{background:var(--common-dim);color:var(--common)}
.persona-tab.active-fra{background:var(--fra-dim);color:var(--fra)}
.persona-tab.active-marti{background:var(--marti-dim);color:var(--marti)}
/* STATS FILTER PANEL */
.stats-filter-row{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.stats-filter-btn{padding:5px 12px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;font-family:'Sora',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:4px}
.stats-filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(244,114,182,.1)}
/* INCOME/EXPENSE BARS */
.in-out-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.in-out-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.in-out-label{font-size:12px;color:var(--text2);width:60px;flex-shrink:0}
.in-out-bar-wrap{flex:1;height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.in-out-fill{height:100%;border-radius:5px;transition:width .5s}
.in-out-amt{font-size:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;min-width:60px;text-align:right}
.net-row{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);margin-top:4px}
/* PIE */
.pie-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.pie-legend{flex:1;min-width:0}
.pie-legend-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:12px}
.pie-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pie-leg-name{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-leg-pct{font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--text3);margin-right:4px}
.pie-leg-amt{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;min-width:48px;text-align:right}
/* HEATMAP */
.heatmap-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px}
.heatmap-title{font-size:12px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.heatmap-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3)}
.heatmap-legend-dot{width:10px;height:10px;border-radius:2px}
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.heatmap-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.heatmap-dow-lbl{font-size:9px;color:var(--text3);text-align:center}
.heatmap-cell{aspect-ratio:1;border-radius:3px;cursor:pointer;transition:transform .1s}
.heatmap-cell:active{transform:scale(.88)}
.heatmap-cell.empty{background:transparent;cursor:default}
.heatmap-cell.today{outline:2px solid var(--accent);outline-offset:1px}
.heatmap-tooltip{position:fixed;background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:8px 11px;font-size:12px;z-index:999;pointer-events:none;display:none;max-width:170px}
/* COMPARE / ANNUAL */
.compare-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.compare-month{font-size:11px;color:var(--text2);width:34px;flex-shrink:0}
.compare-bar-wrap{flex:1;height:16px;background:var(--card2);border-radius:3px;overflow:hidden}
.compare-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.annual-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.annual-month{font-size:10px;color:var(--text2);width:26px;flex-shrink:0}
.annual-bar-wrap{flex:1;height:12px;background:var(--card2);border-radius:3px;overflow:hidden}
.annual-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.annual-amt{font-size:11px;font-family:'Space Grotesk',sans-serif;min-width:50px;text-align:right;color:var(--text2)}
/* PROJECTION */
.projection-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.proj-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px}
.proj-bar{width:100%;height:7px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:7px}
.proj-fill{height:100%;border-radius:4px;background:var(--success);transition:width .5s}
.proj-fill.warn{background:var(--warn)}.proj-fill.over{background:var(--danger)}
/* REGOLAMENTO */
.settle-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:14px;text-align:center}
.settle-amount{font-size:32px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin:6px 0}
.reg-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;margin-bottom:7px}
.reg-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.reg-amount{font-size:17px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--success)}
.reg-desc{font-size:12px;color:var(--text2)}.reg-date{font-size:11px;color:var(--text3)}
/* RECURRING */
.recur-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.recur-info{flex:1;min-width:0}
.recur-name{font-size:13px;font-weight:500}
.recur-meta{font-size:11px;color:var(--text2);margin-top:2px}
.recur-amount{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--common);flex-shrink:0}
.recur-actions{display:flex;gap:5px;flex-shrink:0}
/* CAT MANAGER */
.cat-manage-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cat-manage-item:last-child{border-bottom:none}
.cat-emoji-btn{font-size:22px;background:none;border:none;cursor:pointer;padding:2px 6px}
.cat-name-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 10px;font-size:13px;font-family:'Sora',sans-serif;outline:none}
.cat-name-input:focus{border-color:var(--accent)}
.cat-del-btn{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px}
/* MISC */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:10px}.empty-text{font-size:13px;line-height:1.6}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border2);border-radius:50px;padding:9px 18px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
#fileInput,#imgInput{display:none}
.api-notice{background:var(--fra-dim);border:1px solid rgba(232,168,124,.3);border-radius:var(--radius-sm);padding:11px 13px;font-size:12px;color:var(--fra);margin-bottom:14px}
.budget-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}

.budget-input-sm:focus{border-color:var(--accent)}
.active-filter-bar{background:rgba(244,114,182,.08);border-bottom:1px solid rgba(244,114,182,.2);padding:6px 14px;font-size:11px;color:var(--accent);display:none;align-items:center;gap:6px}
.active-filter-bar.show{display:flex}
</style>

<script>
// ═══ SUPABASE ═══
const SB_URL='https://mrbzrckqnykjxrwdaaxt.supabase.co/rest/v1';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yYnpyY2txbnlranhyd2RhYXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2OTg3MzksImV4cCI6MjA5MjI3NDczOX0.AQxFpmXrpy_WAURF4YMwllf2whK1_UpsUHP-YIy2BxM';
const SBH={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};
async function sb(table,method='GET',body=null,query=''){
  const opts={method,headers:{...SBH}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(`${SB_URL}/${table}?${query}`,opts);
  if(!res.ok)throw new Error(await res.text());
  if(method==='DELETE')return null;
  const t=await res.text();return t?JSON.parse(t):null;
}

// ═══ DEFAULT CATEGORIES ═══
const DEFAULT_CATS=[
  {id:'spesa',icon:'🛒',name:'Spesa'},
  {id:'cene fuori',icon:'🍽️',name:'Cene fuori'},
  {id:'casa',icon:'🏠',name:'Casa'},
  {id:'bollette',icon:'⚡',name:'Bollette'},
  {id:'affitto',icon:'🔑',name:'Affitto'},
  {id:'viaggi',icon:'✈️',name:'Viaggi'},
  {id:'regali',icon:'🎁',name:'Regali'},
  {id:'vestiti',icon:'👗',name:'Vestiti'},
  {id:'auto',icon:'🚗',name:'Auto'},
  {id:'salute',icon:'💊',name:'Salute'},
  {id:'cura personale',icon:'🧴',name:'Cura personale'},
  {id:'divertimento/ cultura',icon:'🎭',name:'Divertimento'},
  {id:'altro',icon:'📦',name:'Altro'},
];
const CAT_COLORS={'spesa':'#6ee7b7','cene fuori':'#f472b6','casa':'#a78bfa','bollette':'#fbbf24','affitto':'#f87171','viaggi':'#38bdf8','regali':'#fb923c','vestiti':'#e879f9','auto':'#94a3b8','salute':'#34d399','cura personale':'#f9a8d4','divertimento/ cultura':'#c084fc','altro':'#64748b'};
const DEFAULT_CAT_COLORS=['#6ee7b7','#f472b6','#a78bfa','#fbbf24','#f87171','#38bdf8','#fb923c','#e879f9','#94a3b8','#34d399','#c084fc','#f9a8d4','#64748b'];
const INCOME_TYPES={stipendio:'💼',investimenti:'📈',rimborso:'🔄',altro:'📦'};
const MI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MI3=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const DOW=['L','M','M','G','V','S','D'];

// ═══ STATE ═══
let S={
  expenses:[],regolamenti:[],recurring:[],incomes:[],
  budgets:{},apiKey:'',
  categories:[...DEFAULT_CATS],
  currentMonth:new Date().getMonth(),currentYear:new Date().getFullYear(),
  editingId:null,editingRecurId:null,editingIncomeId:null,detailType:'expense',
  payer:'Conto comune',split:'Parti uguali',regBenef:'Fra',
  recurPayer:'Conto comune',recurSplit:'Parti uguali',
  incomeOwner:'Fra',
  customSplitPct:50,attachBase64:null,attachMime:null,
  searchQ:'',
  filterOpen:false,
  appliedFilters:{dateFrom:'',dateTo:'',type:'all',cat:'all'},
  pendingFilters:{dateFrom:'',dateTo:'',type:'all',cat:'all'},
  statsSub:'heatmap',
  persona:'insieme',
  statsFilter:{type:'all',cat:'all'}
};

// ═══ HELPERS ═══
function getCat(id){return S.categories.find(c=>c.id===id)||{id:id,icon:'📦',name:id};}
function getCatColor(id){return CAT_COLORS[id]||DEFAULT_CAT_COLORS[S.categories.findIndex(c=>c.id===id)%DEFAULT_CAT_COLORS.length]||'#64748b';}
function fmt(n){return'€'+parseFloat(n||0).toFixed(2).replace('.',',');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function setSyncStatus(s){document.getElementById('syncDot').className='sync-dot '+s;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ═══ STORAGE ═══
function saveLocal(){
  try{localStorage.setItem('bmf5',JSON.stringify({expenses:S.expenses,regolamenti:S.regolamenti,recurring:S.recurring,incomes:S.incomes,budgets:S.budgets,apiKey:S.apiKey,categories:S.categories}));}catch(e){}
}
function loadLocal(){
  try{
    const d=JSON.parse(localStorage.getItem('bmf5')||localStorage.getItem('bmf4')||localStorage.getItem('bmf3')||'{}');
    if(d.expenses)S.expenses=d.expenses;if(d.regolamenti)S.regolamenti=d.regolamenti;
    if(d.recurring)S.recurring=d.recurring;if(d.incomes)S.incomes=d.incomes;
    if(d.budgets)S.budgets=d.budgets;if(d.apiKey)S.apiKey=d.apiKey;
    if(d.categories&&d.categories.length)S.categories=d.categories;
  }catch(e){}
}

async function loadAll(){
  setSyncStatus('loading');
  try{
    const[e,r,inc]=await Promise.all([
      sb('expenses','GET',null,'order=date.desc'),
      sb('regolamenti','GET',null,'order=date.desc'),
      sb('incomes','GET',null,'order=date.desc').catch(()=>[])
    ]);
    S.expenses=e||[];S.regolamenti=r||[];S.incomes=inc||[];
    saveLocal();setSyncStatus('ok');render();checkAndInsertRecurring();
  }catch(err){setSyncStatus('err');showToast('⚠️ Offline');loadLocal();render();}
}

// ═══ MONTH ═══
function changeMonth(d){
  S.currentMonth+=d;
  if(S.currentMonth<0){S.currentMonth=11;S.currentYear--;}
  if(S.currentMonth>11){S.currentMonth=0;S.currentYear++;}
  render();
}

// ═══ FILTERS ═══
function toggleFilterPanel(){
  S.filterOpen=!S.filterOpen;
  const panel=document.getElementById('filterPanel');
  panel.classList.toggle('open',S.filterOpen);
  buildFCatChips();
}
function buildFCatChips(){
  const wrap=document.getElementById('fCatChips');
  let h=`<div class="fchip active" data-val="all" onclick="setFChip('cat',this)">Tutte</div>`;
  S.categories.forEach(c=>{
    const isActive=S.pendingFilters.cat===c.id;
    h+=`<div class="fchip${isActive?' active':''}" data-val="${c.id}" onclick="setFChip('cat',this)">${c.icon} ${c.name}</div>`;
  });
  wrap.innerHTML=h;
}
function setFChip(group,el){
  S.pendingFilters[group]=el.dataset.val;
  const containerId=group==='type'?'fTypeChips':'fCatChips';
  document.querySelectorAll(`#${containerId} .fchip`).forEach(c=>{
    c.classList.toggle('active',c===el);
    if(c===el&&group==='type'){
      c.className='fchip active'+(el.dataset.val==='fra'?' fra':el.dataset.val==='marti'?' marti':el.dataset.val==='common'?' common':'');
    }
  });
}
function applyFilters(){
  S.pendingFilters.dateFrom=document.getElementById('fDateFrom').value;
  S.pendingFilters.dateTo=document.getElementById('fDateTo').value;
  S.appliedFilters={...S.pendingFilters};
  S.filterOpen=false;
  document.getElementById('filterPanel').classList.remove('open');
  updateActiveFilterBar();
  render();

function updateActiveFilterBar(){

function filterExpenses(exps){
  const af=S.appliedFilters;
  return exps.filter(e=>{
    if(S.searchQ&&!(e.description||'').toLowerCase().includes(S.searchQ)&&!(e.category||'').toLowerCase().includes(S.searchQ))return false;
    if(af.dateFrom&&e.date<af.dateFrom)return false;
    if(af.dateTo&&e.date>af.dateTo)return false;
    if(af.cat!=='all'&&e.category!==af.cat)return false;
    if(af.type==='common'&&(e.payer||'').toLowerCase()!=='conto comune')return false;
    if(af.type==='fra'){const sp=(e.split||'').toLowerCase();if(sp!=='solo fra'&&sp!=='parti uguali'&&sp!=='personalizzata')return false;}
    if(af.type==='marti'){const sp=(e.split||'').toLowerCase();if(sp!=='solo marti'&&sp!=='parti uguali'&&sp!=='personalizzata')return false;}
    return true;
  });
}

// ═══ DATA HELPERS ═══
function monthExpenses(m,y){const mon=m!==undefined?m:S.currentMonth,yr=y!==undefined?y:S.currentYear;return S.expenses.filter(e=>{const d=new Date(e.date);return d.getMonth()===mon&&d.getFullYear()===yr;});}
function monthIncomes(m,y){const mon=m!==undefined?m:S.currentMonth,yr=y!==undefined?y:S.currentYear;return S.incomes.filter(i=>{const d=new Date(i.date);return d.getMonth()===mon&&d.getFullYear()===yr;});}

function calcSplit(e){
  const amt=parseFloat(e.amount)||0;
  let fC=0,mC=0,fS=0,mS=0;
  const sp=(e.split||'').toLowerCase(),py=(e.payer||'').toLowerCase();
  if(sp==='parti uguali'){fC=amt/2;mC=amt/2;}
  else if(sp==='solo fra'){fC=amt;}
  else if(sp==='solo marti'){mC=amt;}
  else if(sp==='personalizzata'){const pct=parseFloat(e.splitPct||50)/100;fC=amt*pct;mC=amt*(1-pct);}
  if(py==='fra')fS=amt;else if(py==='marti')mS=amt;else{fS=amt/2;mS=amt/2;}
  return{fraCharge:fC,martiCharge:mC,fraSpent:fS,martiSpent:mS};
}

function calcBalances(m,y){
  let fST=0,mST=0,fCT=0,mCT=0;
  monthExpenses(m,y).forEach(e=>{const{fraCharge,martiCharge,fraSpent,martiSpent}=calcSplit(e);fCT+=fraCharge;mCT+=martiCharge;fST+=fraSpent;mST+=martiSpent;});
  return{fraSpentTotal:fST,martiSpentTotal:mST,fraChargeTotal:fCT,martiChargeTotal:mCT,saldo:fCT-fST};
}

function calcIncomeByPerson(m,y){
  const incs=monthIncomes(m,y);
  let fra=0,marti=0,comune=0;
  incs.forEach(i=>{
    const amt=parseFloat(i.amount)||0;
    if(i.owner==='Fra')fra+=amt;else if(i.owner==='Marti')marti+=amt;else comune+=amt;
  });
  return{fra,marti,comune,total:fra+marti+comune};
}

function calcNetSaldo(){
  let fCT=0,fST=0;
  S.expenses.forEach(e=>{const{fraCharge,fraSpent}=calcSplit(e);fCT+=fraCharge;fST+=fraSpent;});
  let net=fCT-fST;
  S.regolamenti.forEach(r=>{const amt=parseFloat(r.amount)||0;if(r.beneficiario==='Fra')net-=amt;else net+=amt;});
  return net;
}

// ═══ RECURRING ═══
function checkAndInsertRecurring(){
  const now=new Date(),tm=now.getMonth(),ty=now.getFullYear(),td=now.getDate();
  S.recurring.forEach(r=>{
    if(!r.active)return;
    const already=S.expenses.some(e=>e.recurId===r.id&&new Date(e.date).getMonth()===tm&&new Date(e.date).getFullYear()===ty);
    if(!already&&td>=parseInt(r.day)){
      const ds=`${ty}-${String(tm+1).padStart(2,'0')}-${String(r.day).padStart(2,'0')}`;
      const exp={id:uid(),amount:r.amount,description:r.name,date:ds,category:r.category,payer:r.payer,split:r.split,recurId:r.id};
      sb('expenses','POST',exp,'').then(()=>{S.expenses.unshift(exp);saveLocal();render();showToast('🔄 '+r.name);}).catch(()=>{});
    }
  });
}

function getStatsExps(m,y){
  let exps=monthExpenses(m,y);

// ═══ HEATMAP ═══
function renderHeatmap(){
  const daysInMonth=new Date(S.currentYear,S.currentMonth+1,0).getDate();
  const firstDow=(new Date(S.currentYear,S.currentMonth,1).getDay()+6)%7;
  const today=new Date();
  const dayTotals={};
  getStatsExps().forEach(e=>{const d=parseInt(e.date.split('-')[2]);dayTotals[d]=(dayTotals[d]||0)+parseFloat(e.amount||0);});
  const maxDay=Math.max(...Object.values(dayTotals),1);
  const rows=Math.ceil((firstDow+daysInMonth)/7);
  let h=`<div class="heatmap-wrap">
    <div class="heatmap-title"><span>Spese per giorno — ${MI[S.currentMonth]}</span>
      <div class="heatmap-legend"><div class="heatmap-legend-dot" style="background:var(--card2)"></div><span style="margin:0 4px">€0</span><div class="heatmap-legend-dot" style="background:#f472b688"></div><div class="heatmap-legend-dot" style="background:#f472b6;margin-left:3px"></div><span style="margin-left:4px">alto</span></div>
    </div>
    <div class="heatmap-dow">${DOW.map(d=>`<div class="heatmap-dow-lbl">${d}</div>`).join('')}</div>
    <div class="heatmap-grid">`;
  let day=1;
  for(let i=0;i<rows*7;i++){
    if(i<firstDow||day>daysInMonth){h+=`<div class="heatmap-cell empty"></div>`;continue;}
    const amt=dayTotals[day]||0;
    const isToday=today.getDate()===day&&today.getMonth()===S.currentMonth&&today.getFullYear()===S.currentYear;
    const intensity=amt>0?Math.max(0.15,amt/maxDay):0;
    const bg=amt>0?`rgba(244,114,182,${intensity})`:'var(--card2)';
    const border=amt>0?`rgba(244,114,182,${Math.min(intensity+0.2,1)})`:'transparent';
    h+=`<div class="heatmap-cell${isToday?' today':''}" data-day="${day}" style="background:${bg};border:1px solid ${border}" onmouseenter="showHmTooltip(event,${day},${amt})" onmouseleave="hideHmTooltip()" ontouchstart="showHmTooltipTouch(event,${day},${amt})"></div>`;
    day++;
  }
  h+=`</div>`;
  const busiest=Object.entries(dayTotals).sort((a,b)=>b[1]-a[1])[0];
  const allExps=getStatsExps();
  const avgDay=allExps.reduce((s,e)=>s+parseFloat(e.amount||0),0)/Math.max(Object.keys(dayTotals).length,1);
  h+=`<div style="margin-top:10px;display:flex;justify-content:space-between;font-size:11px;color:var(--text2)">
    ${busiest?`<span>🔥 ${busiest[0]}° ${fmt(busiest[1])}</span><span>Media: ${fmt(avgDay)}/giorno</span>`:'<span style="color:var(--text3)">Nessuna spesa</span>'}
  </div></div>`;
  return h;
}

function showHmTooltip(ev,day,amt){
  const tt=document.getElementById('hmTooltip');
  const exps=getStatsExps().filter(e=>parseInt(e.date.split('-')[2])===day);
  if(!exps.length){tt.style.display='none';return;}
  tt.innerHTML=`<div style="font-weight:600;margin-bottom:4px">${day} ${MI[S.currentMonth]}</div>`+exps.map(e=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${getCat(e.category).icon} ${(e.description||e.category).slice(0,16)}</span><span style="font-family:'Space Grotesk'">${fmt(e.amount)}</span></div>`).join('')+`<div style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border);display:flex;justify-content:space-between"><b>Tot.</b><b style="font-family:'Space Grotesk'">${fmt(amt)}</b></div>`;
  tt.style.display='block';
  const r=ev.target.getBoundingClientRect();
  tt.style.left=Math.min(r.left,window.innerWidth-180)+'px';
  tt.style.top=(r.bottom+6)+'px';
}
function showHmTooltipTouch(ev,day,amt){ev.preventDefault();showHmTooltip({target:ev.target},day,amt);setTimeout(hideHmTooltip,2500);}
function hideHmTooltip(){document.getElementById('hmTooltip').style.display='none';}

// ═══ OVERVIEW ═══
function renderOverview(){
  const allExps=getStatsExps();
  let exps=allExps;
  if(S.persona==='fra')exps=allExps.filter(e=>{const sp=(e.split||'').toLowerCase();return sp==='solo fra'||sp==='parti uguali'||sp==='personalizzata';});
  if(S.persona==='marti')exps=allExps.filter(e=>{const sp=(e.split||'').toLowerCase();return sp==='solo marti'||sp==='parti uguali'||sp==='personalizzata';});
  const bycat={};let total=0;
  exps.forEach(e=>{
    const{fraCharge,martiCharge}=calcSplit(e);
    const charge=S.persona==='fra'?fraCharge:S.persona==='marti'?martiCharge:parseFloat(e.amount)||0;
    bycat[e.category]=(bycat[e.category]||0)+charge;total+=charge;
  });
  const sorted=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);
  const now=new Date();
  const daysInMonth=new Date(S.currentYear,S.currentMonth+1,0).getDate();
  const daysPassed=S.currentMonth===now.getMonth()&&S.currentYear===now.getFullYear()?now.getDate():daysInMonth;
  const projected=daysPassed>0?(total/daysPassed)*daysInMonth:0;
  const accentColor=S.persona==='fra'?'var(--fra)':S.persona==='marti'?'var(--marti)':'var(--accent)';

  // Income/net for this persona
  const{fra:fraInc,marti:martiInc,comune}=calcIncomeByPerson();
  const personaInc=S.persona==='fra'?fraInc+comune/2:S.persona==='marti'?martiInc+comune/2:fraInc+martiInc+comune;
  const netVal=personaInc-total;

  let h=`<div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Uscite</div><div class="stat-value" style="color:${accentColor}">${fmt(total)}</div><div class="stat-sub">${exps.length} spese</div></div>
    <div class="stat-card"><div class="stat-label">Entrate</div><div class="stat-value" style="color:var(--income)">${fmt(personaInc)}</div><div class="stat-sub">netto: <span style="color:${netVal>=0?'var(--success)':'var(--danger)'};font-weight:600">${netVal>=0?'+':''}${fmt(netVal)}</span></div></div>
  </div>`;

  if(sorted.length){
    const fillPct=Math.min(projected>0?(total/projected)*100:0,100).toFixed(0);
    const projClass=fillPct>=100?'over':fillPct>=80?'warn':'';
    h+=`<div class="projection-card">
      <div class="proj-row"><span style="color:var(--text2)">Proiezione fine mese</span><span style="font-family:'Space Grotesk'">${fmt(projected)}</span></div>
      <div class="proj-row"><span style="color:var(--text3);font-size:11px">Oggi: ${fmt(total)} (${fillPct}%)</span><span style="color:var(--text3);font-size:11px">${daysInMonth-daysPassed} gg rimasti</span></div>
      <div class="proj-bar"><div class="proj-fill ${projClass}" style="width:${fillPct}%;background:${accentColor}"></div></div>
    </div>
    <div class="section-label">Per categoria</div>
    <div class="pie-wrap">
      <div style="flex-shrink:0"><canvas id="pieChart" width="120" height="120"></canvas></div>
      <div class="pie-legend">`;
    sorted.slice(0,6).forEach(([cat,amt])=>{
      const c=getCat(cat),col=getCatColor(cat);
      const pct=total>0?(amt/total*100).toFixed(0):0;
      h+=`<div class="pie-legend-item"><div class="pie-dot" style="background:${col}"></div><div class="pie-leg-name">${c.icon} ${c.name}</div><div class="pie-leg-pct">${pct}%</div><div class="pie-leg-amt">${fmt(amt)}</div></div>`;
    });
    h+=`</div></div><div class="section-label">Dettaglio</div>`;
    sorted.forEach(([cat,amt])=>{
      const bud=S.persona==='insieme'?S.budgets[cat]:0;
      const c=getCat(cat),col=getCatColor(cat);
      const barW=total>0?(amt/total*100).toFixed(0):0;
      const budAlert=bud>0&&amt>bud?'var(--danger)':bud>0&&amt/bud>0.8?'var(--warn)':col;
      h+=`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="color:var(--text2)">${c.icon} ${c.name}</span>
          <span style="font-family:'Space Grotesk';font-weight:500">${fmt(amt)}${bud>0?` <span style="color:var(--text3);font-size:11px">/ ${fmt(bud)}</span>`:''}</span>
        </div>
        <div style="height:5px;background:var(--card2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${barW}%;background:${bud>0?budAlert:col};border-radius:3px;transition:width .4s"></div></div>
      </div>`;
    });
    setTimeout(()=>drawPie(S.persona,sorted,total),30);
  } else h+=`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">Nessun dato per questo filtro</div></div>`;
  return h;
}

function drawPie(persona,sorted,total){
  const canvas=document.getElementById('pieChart');if(!canvas||!sorted||!sorted.length)return;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,120,120);
  let angle=-Math.PI/2;
  sorted.forEach(([cat,amt])=>{
    const slice=total>0?(amt/total)*Math.PI*2:0;
    ctx.beginPath();ctx.moveTo(60,60);ctx.arc(60,60,55,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=getCatColor(cat);ctx.fill();angle+=slice;
  });
  ctx.beginPath();ctx.arc(60,60,25,0,Math.PI*2);ctx.fillStyle='#1e1e35';ctx.fill();
  ctx.fillStyle='#f0f0f5';ctx.font='bold 11px "Space Grotesk",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(persona==='fra'?'Fra':persona==='marti'?'Marti':'Tot',60,60);
}

// ═══ COMPARE ═══
function renderCompare(){
  const months=[];
  for(let i=5;i>=0;i--){
    let m=S.currentMonth-i,y=S.currentYear;
    if(m<0){m+=12;y--;}
    const exps=getStatsExps(m,y);
    let total=0;
    exps.forEach(e=>{const{fraCharge,martiCharge}=calcSplit(e);total+=S.persona==='fra'?fraCharge:S.persona==='marti'?martiCharge:parseFloat(e.amount)||0;});
    months.push({m,y,total,label:MI3[m]});
  }
  const maxAmt=Math.max(...months.map(x=>x.total),1);
  const accentColor=S.persona==='fra'?'var(--fra)':S.persona==='marti'?'var(--marti)':'var(--accent)';
  let h=`<div class="section-label">Ultimi 6 mesi</div>`;
  months.forEach(mo=>{
    const isCur=mo.m===S.currentMonth&&mo.y===S.currentYear;
    const pct=(mo.total/maxAmt*100).toFixed(0);
    h+=`<div class="compare-bar-row">
      <span class="compare-month" style="${isCur?`color:${accentColor};font-weight:600`:''}">${mo.label}</span>
      <div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${pct}%;background:${isCur?accentColor:'var(--text3)'}"></div></div>
      <span style="font-size:11px;font-family:'Space Grotesk';min-width:52px;text-align:right;${isCur?'color:var(--text)':''}">${fmt(mo.total)}</span>
    </div>`;
  });
  const cur=months[5].total,prev=months[4].total,delta=cur-prev,deltaPct=prev>0?((delta/prev)*100).toFixed(0):0;
  h+=`<div class="stat-card" style="margin-top:14px"><div class="stat-label">Vs mese scorso</div><div class="stat-value" style="color:${delta>0?'var(--danger)':delta<0?'var(--success)':'var(--text2)'}">${delta>=0?'+':''}${fmt(delta)}</div><div class="stat-sub">${delta>0?'↑':'↓'} ${Math.abs(deltaPct)}%</div></div>`;
  return h;
}

// ═══ ANNUAL ═══
function renderAnnual(){
  const months=[];
  for(let m=0;m<12;m++){
    const exps=getStatsExps(m,S.currentYear);
    let total=0;
    exps.forEach(e=>{const{fraCharge,martiCharge}=calcSplit(e);total+=S.persona==='fra'?fraCharge:S.persona==='marti'?martiCharge:parseFloat(e.amount)||0;});
    months.push({m,total});
  }
  const maxAmt=Math.max(...months.map(x=>x.total),1);
  const yearTotal=months.reduce((s,x)=>s+x.total,0);
  const accentColor=S.persona==='fra'?'var(--fra)':S.persona==='marti'?'var(--marti)':'var(--accent)';
  let h=`<div class="stats-grid" style="margin-bottom:14px">
    <div class="stat-card"><div class="stat-label">Totale ${S.currentYear}</div><div class="stat-value" style="color:${accentColor}">${fmt(yearTotal)}</div></div>
    <div class="stat-card"><div class="stat-label">Media mensile</div><div class="stat-value">${fmt(yearTotal/12)}</div></div>
  </div><div class="section-label">Mese per mese</div>`;
  months.forEach(({m,total})=>{
    const pct=(total/maxAmt*100).toFixed(0),isCur=m===S.currentMonth;
    h+=`<div class="annual-row">
      <span class="annual-month" style="${isCur?`color:${accentColor};font-weight:600`:''}">${MI3[m]}</span>
      <div class="annual-bar-wrap"><div class="annual-bar-fill" style="width:${pct}%;background:${isCur?accentColor:'var(--marti)'}"></div></div>
      <span class="annual-amt" style="${isCur?'color:var(--text)':''}">${fmt(total)}</span>
    </div>`;
  });
  return h;
}

    <button class="btn-secondary" onclick="closeModal('detailModal');openIncomeModal('${id}')">✏️ Modifica</button>`;
  document.getElementById('detailModal').classList.add('open');
}

// ═══ PILLS ═══
function selectPill(group,el){
  S[group]=el.dataset.val;updatePillUI(group);
  if(group==='split')document.getElementById('customSplitWrap').style.display=el.dataset.val==='Personalizzata'?'block':'none';
}
function updatePillUI(group){
  const map={payer:'payerGroup',split:'splitGroup',regBenef:'regBenefGroup',recurPayer:'recurPayerGroup',recurSplit:'recurSplitGroup',incomeOwner:'incomeOwnerGroup'};
  const gid=map[group];if(!gid)return;
  const val=S[group];
  document.querySelectorAll(`#${gid} .pill-opt`).forEach(b=>{
    b.classList.remove('fra-active','marti-active','common-active','active');
    if(b.dataset.val===val){
      if(val==='Fra'||val==='Solo Fra')b.classList.add('fra-active');
      else if(val==='Marti'||val==='Solo Marti')b.classList.add('marti-active');
      else if(val==='Personalizzata')b.classList.add('active');
      else b.classList.add('common-active');
    }
  });
}

// ═══ SAVE EXPENSE ═══
async function saveExpense(){
  const amount=parseFloat(document.getElementById('inp_amount').value);
  if(!amount||amount<=0){showToast('Importo non valido');return;}
  const desc=document.getElementById('inp_desc').value.trim();
  const date=document.getElementById('inp_date').value;
  const category=document.getElementById('inp_cat').value;
  const note=document.getElementById('inp_note').value.trim();
  if(!date){showToast('Inserisci una data');return;}
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Salvataggio…';
  const exp={id:S.editingId||uid(),amount,description:desc,date,category,payer:S.payer,split:S.split,note,splitPct:S.split==='Personalizzata'?S.customSplitPct:null,photoBase64:S.attachBase64||null,photoMime:S.attachMime||null};
  try{
    if(S.editingId){await sb('expenses','PATCH',{amount,description:desc,date,category,payer:S.payer,split:S.split,note,splitPct:exp.splitPct,photoBase64:exp.photoBase64,photoMime:exp.photoMime},`id=eq.${S.editingId}`);S.expenses=S.expenses.map(e=>e.id===S.editingId?exp:e);}
    else{await sb('expenses','POST',exp,'');S.expenses.unshift(exp);}
    saveLocal();closeModal('addModal');render();showToast('✓ Spesa salvata');setSyncStatus('ok');
  }catch(err){showToast('⚠️ Errore: '+err.message);setSyncStatus('err');}
  finally{btn.disabled=false;btn.textContent='Salva Spesa';}
}

// ═══ SAVE INCOME ═══
async function saveIncome(){
  const amount=parseFloat(document.getElementById('inc_amount').value);
  if(!amount||amount<=0){showToast('Importo non valido');return;}
  const desc=document.getElementById('inc_desc').value.trim();
  const date=document.getElementById('inc_date').value;
  const type=document.getElementById('inc_type').value;
  const note=document.getElementById('inc_note').value.trim();
  const btn=document.getElementById('saveIncomeBtn');btn.disabled=true;btn.textContent='Salvataggio…';
  const inc={id:S.editingIncomeId||uid(),amount,description:desc,date,type,owner:S.incomeOwner,note};
  try{
    if(S.editingIncomeId){await sb('incomes','PATCH',{amount,description:desc,date,type,owner:S.incomeOwner,note},`id=eq.${S.editingIncomeId}`);S.incomes=S.incomes.map(i=>i.id===S.editingIncomeId?inc:i);}
    else{await sb('incomes','POST',inc,'');S.incomes.unshift(inc);}
    saveLocal();closeModal('incomeModal');render();showToast('✓ Entrata salvata');setSyncStatus('ok');
  }catch(err){showToast('⚠️ Errore: '+err.message);setSyncStatus('err');}
  finally{btn.disabled=false;btn.textContent='Salva Entrata';}
}

// ═══ DELETE ═══
function deleteCurrentItem(){
  if(S.detailType==='income')deleteCurrentIncome();
  else deleteCurrentExpense();
}
async function deleteCurrentExpense(){
  if(!confirm('Eliminare?'))return;
  try{await sb('expenses','DELETE',null,`id=eq.${S.editingId}`);S.expenses=S.expenses.filter(e=>e.id!==S.editingId);saveLocal();closeModal('detailModal');render();showToast('🗑️ Eliminata');}
  catch(err){showToast('⚠️ Errore');}
}
async function deleteCurrentIncome(){
  if(!confirm('Eliminare?'))return;
  try{await sb('incomes','DELETE',null,`id=eq.${S.editingIncomeId}`);S.incomes=S.incomes.filter(i=>i.id!==S.editingIncomeId);saveLocal();closeModal('detailModal');render();showToast('🗑️ Eliminata');}
  catch(err){showToast('⚠️ Errore');}
}

// ═══ REGOLAMENTO ═══
function openRegModal(){document.getElementById('reg_date').value=new Date().toISOString().split('T')[0];document.getElementById('reg_amount').value='';document.getElementById('reg_desc').value='';S.regBenef='Fra';updatePillUI('regBenef');document.getElementById('regModal').classList.add('open');}
async function saveRegolamento(){
  const amount=parseFloat(document.getElementById('reg_amount').value);if(!amount||amount<=0){showToast('Importo non valido');return;}

  try{await sb('regolamenti','POST',reg,'');S.regolamenti.unshift(reg);saveLocal();closeModal('regModal');render();showToast('✓ Salvato');}
  catch(err){showToast('⚠️ Errore: '+err.message);}

// ═══ RECURRING ═══
function openRecurModal(id){
  S.editingRecurId=id||null;document.getElementById('recurModalTitle').textContent=id?'Modifica':'Nuova Ricorrente';
  populateCatSelects();
  if(id){const r=S.recurring.find(x=>x.id===id);document.getElementById('recur_name').value=r.name;document.getElementById('recur_amount').value=r.amount;document.getElementById('recur_cat').value=r.category;document.getElementById('recur_day').value=r.day;S.recurPayer=r.payer;S.recurSplit=r.split;}
  else{document.getElementById('recur_name').value='';document.getElementById('recur_amount').value='';document.getElementById('recur_day').value='1';S.recurPayer='Conto comune';S.recurSplit='Parti uguali';}
  updatePillUI('recurPayer');updatePillUI('recurSplit');document.getElementById('recurModal').classList.add('open');
}
function saveRecurring(){
  const name=document.getElementById('recur_name').value.trim(),amount=parseFloat(document.getElementById('recur_amount').value);
  if(!name||!amount){showToast('Compila nome e importo');return;}
  const rec={id:S.editingRecurId||uid(),name,amount,category:document.getElementById('recur_cat').value,day:parseInt(document.getElementById('recur_day').value)||1,payer:S.recurPayer,split:S.recurSplit,active:true};
  if(S.editingRecurId)S.recurring=S.recurring.map(r=>r.id===S.editingRecurId?rec:r);else S.recurring.push(rec);
  saveLocal();closeModal('recurModal');render();showToast('✓ Salvata');
}
function deleteRecurring(id){if(!confirm('Eliminare?'))return;S.recurring=S.recurring.filter(r=>r.id!==id);saveLocal();render();showToast('🗑️ Eliminata');}

// ═══ SCAN ═══
async function handleImage(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    const b64=ev.target.result.split(',')[1];
    document.getElementById('scanPreview').src=ev.target.result;document.getElementById('scanPreview').style.display='block';
    if(!S.apiKey){document.getElementById('scanStatus').innerHTML='⚠️ Nessuna API Key.';document.getElementById('scanStatus').className='scan-status error';return;}
    document.getElementById('scanStatus').innerHTML='<span class="spinner"></span> Analisi…';document.getElementById('scanStatus').className='scan-status loading';
    try{
      const catList=S.categories.map(c=>c.id).join(', ');
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type,data:b64}},{type:'text',text:`Analizza questo scontrino e rispondi SOLO con JSON: {"amount":<numero>,"description":"<desc breve italiano>","date":"<YYYY-MM-DD o null>","category":"<una di: ${catList}>"}`}]}]})});
      const data=await res.json();
      const parsed=JSON.parse(data.content?.[0]?.text?.replace(/```json|```/g,'')||'{}');
      if(parsed.amount)document.getElementById('inp_amount').value=parsed.amount;
      if(parsed.description)document.getElementById('inp_desc').value=parsed.description;
      if(parsed.date&&parsed.date!=='null')document.getElementById('inp_date').value=parsed.date;
      if(parsed.category&&S.categories.find(c=>c.id===parsed.category))document.getElementById('inp_cat').value=parsed.category;
      document.getElementById('scanStatus').textContent='✓ Rilevato! Verifica i dati.';document.getElementById('scanStatus').className='scan-status done';
    }catch(err){document.getElementById('scanStatus').textContent='✗ '+err.message;document.getElementById('scanStatus').className='scan-status error';}
  };
  reader.readAsDataURL(file);input.value='';
}
function handleAttach(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(ev)=>{S.attachBase64=ev.target.result.split(',')[1];S.attachMime=file.type;document.getElementById('imgName').textContent=file.name;document.getElementById('imgPreviewAttach').src=ev.target.result;document.getElementById('imgPreviewAttach').style.display='block';};
  reader.readAsDataURL(file);input.value='';
}
function saveApiKey(){S.apiKey=document.getElementById('apiKeyInput').value.trim();saveLocal();showToast('✓ Salvata');}

setInterval(()=>{if(document.visibilityState==='visible')loadAll();},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll();});
loadLocal();render();loadAll();
</script>
